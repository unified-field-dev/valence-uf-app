# PR / merge gate aligned with docs/VERIFICATION.md (valence-backend + teaching
# host + valence-app SSR clippy + Layer 2 e2e).
# Standalone checkout — UF deps resolve via git branch = main on unified-field-dev.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-valence-uf-app
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check
        run: >
          cargo fmt -p valence-backend -p valence-app -p valence-uf-app-e2e -p protected-valence-host
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      # Preferred path from VERIFICATION.md (clippy -D warnings).
      - name: cargo clippy (backend + app SSR + teaching host)
        run: |
          cargo clippy -p valence-backend --all-targets -- -D warnings
          cargo clippy -p protected-valence-host --all-targets -- -D warnings
          # valence-app still carries pedantic+nursery warn debt; keep unwrap/expect deny
          # while RUSTFLAGS=-D warnings would otherwise fail the UI graph on style lints.
          cargo clippy -p valence-app --features ssr --all-targets -- \
            -D warnings -A clippy::pedantic -A clippy::nursery

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (sibling-source UI smokes)
        run: cargo test -p valence-backend --test workspace_members --test product_surface
      - name: cargo test (valence-backend contracts)
        run: cargo test -p valence-backend
      - name: cargo check + run (protected-valence-host)
        run: |
          cargo check -p protected-valence-host
          cargo run -p protected-valence-host

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: valence-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: valence-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: valence-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-valence-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: valence-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: valence-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo test (runtime_contract)
        run: cargo test -p valence-uf-app-e2e --features ssr --test runtime_contract
      - name: cargo test (valence-app ssr units)
        run: cargo test -p valence-app --features ssr
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --project valence-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-valence-uf-app-${{ github.run_id }}
          path: |
            valence-uf-app-e2e/end2end/playwright-report/
            valence-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (valence-backend, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p valence-backend --no-deps

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (valence-app hydrate)
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: cargo dylint --all -p valence-app --no-deps -- --features hydrate
